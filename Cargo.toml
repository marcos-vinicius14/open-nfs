[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/asset",
    "crates/asset-runtime",
    "crates/android-host",
    "tools/converter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Open-NFS Contributors"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[workspace.dependencies]
thiserror = "2.0.11"
tracing = "0.1.41"
bytemuck = { version = "1.21.0", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
sha2 = "0.10.8"
open-nfs-core = { path = "crates/core" }
open-nfs-asset = { path = "crates/asset" }
open-nfs-asset-runtime = { path = "crates/asset-runtime" }
